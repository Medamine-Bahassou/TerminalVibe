name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  appimage:
    # Older glibc (2.35) so the AppImage runs on more distros
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:appimage
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: release/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe
