name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Determine Version & Changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prep.outputs.version }}
      tag: ${{ steps.prep.outputs.tag }}
      title: ${{ steps.prep.outputs.title }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all git tags
        run: git fetch --tags --force

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Calculate next version and release notes
        id: prep
        run: node scripts/prepare-release.js

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md
          if-no-files-found: error

  build-linux:
    name: Build Linux AppImage
    needs: prepare
    # Older glibc (2.35) so the AppImage runs on more Linux distros
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set release version
        run: npm version ${{ needs.prepare.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Run CLI tests
        run: npm test

      - name: Build AppImage
        run: npm run build:appimage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: release/*.AppImage
          if-no-files-found: error

  build-windows:
    name: Build Windows Executables
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set release version
        run: npm version ${{ needs.prepare.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Run CLI tests
        run: npm test

      - name: Build Windows binaries
        run: npm run build:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: release/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts and release notes
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          cp release_notes.md ../release_notes.md 2>/dev/null || true
          rm -f release_notes.md
          sha256sum * > SHA256SUMS.txt
          echo "Generated SHA256 checksums:"
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.title }}
          body_path: release_notes.md
          files: |
            artifacts/*.AppImage
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
